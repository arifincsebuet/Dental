<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dental Care Web</title>
<meta name="description" content="Dental Care clinic management, web edition design prototype.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='26' fill='%230F766E'/%3E%3Cpath fill='%23fff' d='M38,30 C30,30 29,40 32,49 C35,57 35,76 41,79 C46,82 46,61 54,61 C62,61 62,82 67,79 C73,76 73,57 76,49 C79,40 78,30 70,30 C64,29 60,34 54,34 C48,34 44,29 38,30 Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7F7; --surface:#FFFFFF; --surface-2:#F0FDFA; --surface-3:#F8FAFC;
  --ink:#0F1E2E; --ink-2:#334155; --muted:#64748B; --line:#E2E8F0; --line-2:#CBD5E1;
  --brand:#0F766E; --brand-ink:#FFFFFF; --brand-2:#14B8A6; --brand-soft:#CCFBF1; --brand-softer:#E6FBF6;
  --accent:#2563EB; --accent-soft:#DBEAFE;
  --amber:#B45309; --amber-soft:#FEF3C7; --amber-fill:#F59E0B;
  --red:#DC2626; --red-soft:#FEE2E2; --green:#15803D; --green-soft:#DCFCE7;
  --violet:#7C3AED; --violet-soft:#EDE9FE;
  --treated:#60A5FA; --assessed:#FFE9C2; --unassessed:#EEF2F6; --missing:#64748B;
  --shadow:0 1px 2px rgba(15,30,46,.05),0 4px 16px rgba(15,30,46,.05);
  --shadow-lg:0 20px 60px rgba(15,30,46,.18);
  --radius:16px; --radius-sm:10px;
  --nav-w:252px; --top-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081214; --surface:#0F1B1E; --surface-2:#0E2624; --surface-3:#132226;
  --ink:#E6EEF2; --ink-2:#C2CED6; --muted:#8FA1AE; --line:#1E3035; --line-2:#2A4248;
  --brand:#2DD4BF; --brand-ink:#04211E; --brand-2:#5EEAD4; --brand-soft:#134E4A; --brand-softer:#0F302D;
  --accent:#60A5FA; --accent-soft:#172B4D; --amber:#FBBF24; --amber-soft:#3A2A0A; --amber-fill:#F59E0B;
  --red:#F87171; --red-soft:#3B1515; --green:#4ADE80; --green-soft:#0F2E1C; --violet:#A78BFA; --violet-soft:#241B3D;
  --treated:#3B82F6; --assessed:#5B4A2A; --unassessed:#1A2A2F; --missing:#94A3B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#081214; --surface:#0F1B1E; --surface-2:#0E2624; --surface-3:#132226;
  --ink:#E6EEF2; --ink-2:#C2CED6; --muted:#8FA1AE; --line:#1E3035; --line-2:#2A4248;
  --brand:#2DD4BF; --brand-ink:#04211E; --brand-2:#5EEAD4; --brand-soft:#134E4A; --brand-softer:#0F302D;
  --accent:#60A5FA; --accent-soft:#172B4D; --amber:#FBBF24; --amber-soft:#3A2A0A; --amber-fill:#F59E0B;
  --red:#F87171; --red-soft:#3B1515; --green:#4ADE80; --green-soft:#0F2E1C; --violet:#A78BFA; --violet-soft:#241B3D;
  --treated:#3B82F6; --assessed:#5B4A2A; --unassessed:#1A2A2F; --missing:#94A3B8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.92em}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,1fr);height:100vh;height:100dvh}
.side{grid-row:1/3;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);flex:none}
.brand img,.brand svg.logo{width:36px;height:36px;border-radius:10px}
.brand b{font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{padding:12px 10px;overflow:auto;flex:1}
.nav h6{margin:14px 10px 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:600;position:relative}
.nav a:hover{background:var(--surface-3)}
.nav a.on{background:var(--brand-softer);color:var(--brand)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav .badge{margin-left:auto}
.side-foot{padding:12px;border-top:1px solid var(--line)}
.plan{background:linear-gradient(135deg,var(--brand-softer),var(--surface-2));border:1px solid var(--line);border-radius:14px;padding:12px}
.plan .bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.plan .bar i{display:block;height:100%;background:var(--brand);border-radius:6px}

.top{display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.top .crumb{font-weight:700;font-size:16px;white-space:nowrap}
.top .crumb small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:-2px}
.search{flex:1;max-width:560px;margin-left:auto;margin-right:auto;position:relative}
.search button{width:100%;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-3);color:var(--muted);cursor:pointer;text-align:left}
.search button:hover{border-color:var(--line-2)}
kbd{font-family:"JetBrains Mono",monospace;font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.me{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:14px;border:1px solid var(--line);cursor:pointer;background:var(--surface)}
.me b{font-size:13px;display:block;line-height:1.2}.me small{color:var(--muted);font-size:11.5px}
.avatar{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;background:linear-gradient(135deg,#3B82F6,#0F766E);flex:none}
.avatar.lg{width:56px;height:56px;border-radius:16px;font-size:19px}
.main{overflow:auto;min-width:0;min-height:0}
.page{padding:24px clamp(16px,2vw,32px) 40px;min-height:100%}
.menu-btn{display:none}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-softer)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn.danger{color:var(--red)}
.btn svg.i{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.card-h h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.card-h .sub{color:var(--muted);font-size:12.5px}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px 18px 18px}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.badge.teal{background:var(--brand-softer);color:var(--brand)}
.badge.blue{background:var(--accent-soft);color:var(--accent)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.violet{background:var(--violet-soft);color:var(--violet)}
.badge.count{background:var(--red);color:#fff;height:19px;min-width:19px;justify-content:center;padding:0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--line-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line)}
.seg button{height:30px;padding:0 12px;border:0;background:transparent;border-radius:9px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.input,select.input,textarea.input{height:40px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;outline:none;width:100%}
textarea.input{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-softer)}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.switch{position:relative;width:40px;height:23px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;border-radius:20px;background:var(--line-2);transition:.2s}
.switch i::after{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i::after{transform:translateX(17px)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.h1{font-size:clamp(20px,1.6vw,26px);font-weight:800;letter-spacing:-.02em;margin:0}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--muted)}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-3)}
table.t tr.sel td{background:var(--brand-softer)}
.table-wrap{overflow:auto}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-weight:600;font-size:13px}
.notice.teal{background:var(--brand-softer);color:var(--brand)}
.notice.red{background:var(--red-soft);color:var(--red)}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .lbl{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:12.5px}
.kpi .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.kpi .delta{font-size:12px;font-weight:700}
.kpi svg.spark{position:absolute;right:12px;bottom:12px;width:90px;height:34px;opacity:.9}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(320px,1fr)}
.dash .span2{grid-column:1/-1}
@media (min-width:1800px){.dash{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}.dash .wide{grid-column:span 2}}
.lanes{position:relative;overflow-x:auto}
.lanes-inner{min-width:1100px}
.lane-head{display:grid;grid-template-columns:150px 1fr;font-size:11px;color:var(--muted);font-weight:700}
.lane-head .hours{position:relative;height:20px}
.lane-head .hours span{position:absolute;transform:translateX(-50%)}
.lane{display:grid;grid-template-columns:150px 1fr;align-items:center;border-top:1px dashed var(--line);min-height:64px}
.lane .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px}
.lane .who small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.lane .track{position:relative;height:48px}
.blk{position:absolute;top:4px;bottom:4px;border-radius:8px;padding:3px 8px;font-size:11.5px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid transparent}
.blk small{display:block;font-weight:500;opacity:.8}
.blk.open{border:1.5px dashed var(--line-2);background:transparent;color:var(--muted);font-weight:600}
.now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
.now-line::before{content:"Now";position:absolute;top:-2px;left:4px;font-size:10px;font-weight:800;color:var(--red)}
.st-Scheduled{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}
.st-Confirmed{background:var(--accent-soft);color:var(--accent)}
.st-Checked-in{background:var(--violet-soft);color:var(--violet)}
.st-In-progress{background:var(--amber-soft);color:var(--amber)}
.st-Completed{background:var(--green-soft);color:var(--green)}
.st-Cancelled{background:var(--surface-3);color:var(--muted);text-decoration:line-through;border-color:var(--line)}
.st-No-show{background:var(--red-soft);color:var(--red)}
.st-Requested{background:var(--amber-soft);color:var(--amber);border:1.5px dashed var(--amber-fill)}
.list-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block;font-size:13.5px}
.list-item small{color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-3);cursor:pointer;font-weight:700;text-align:left}
.qa button:hover{border-color:var(--brand);background:var(--brand-softer)}
.qa .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;min-width:0}
.bars .b i{display:block;width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--brand);opacity:.85}
.bars .b i.today{background:var(--accent);opacity:1}
.bars .b span{font-size:10.5px;color:var(--muted);font-weight:600}

/* ---------- patients workspace ---------- */
.pw{display:grid;grid-template-columns:320px minmax(0,1fr) 380px;height:calc(100dvh - var(--top-h));}
.pw>section{min-height:0;overflow:auto}
.plist{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden!important}
.plist .head{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.plist .items{overflow:auto;flex:1}
.pitem{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.pitem:hover{background:var(--surface-3)}
.pitem.on{background:var(--brand-softer);box-shadow:inset 3px 0 0 var(--brand)}
.pitem .grow{flex:1;min-width:0}
.pitem b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem small{color:var(--muted);font-size:12px}
.pcenter{padding:20px clamp(16px,1.6vw,28px) 40px}
.prail{border-left:1px solid var(--line);background:var(--surface);padding:18px}
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.phead .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:4px}
.phead .meta span{display:inline-flex;gap:5px;align-items:center}
.phead .meta svg.i{width:14px;height:14px}
.alerts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tabs button .badge{margin-left:6px;height:18px}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.counter{padding:10px 12px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line)}
.counter b{font-size:20px;display:block;font-weight:800}
.counter span{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line-2)}
.odo-wrap{overflow-x:auto;padding:6px 0}
svg.odo{width:100%;min-width:720px;height:auto;display:block;user-select:none}
svg.odo .tooth{cursor:pointer}
svg.odo .tooth .sf{stroke:var(--line-2);stroke-width:1;fill:var(--unassessed);transition:fill .15s}
svg.odo .tooth.assessed .sf{fill:var(--assessed)}
svg.odo .tooth .sf.treated{fill:var(--treated)}
svg.odo .tooth .sf.finding{fill:var(--amber-fill)}
svg.odo .tooth .sf.planned{fill:var(--brand-soft)}
svg.odo .tooth.missing .sf{fill:var(--surface-3);stroke-dasharray:2 2}
svg.odo .tooth .frame{fill:none;stroke:transparent;stroke-width:2.5;rx:9}
svg.odo .tooth:hover .frame{stroke:var(--line-2)}
svg.odo .tooth.sel .frame{stroke:var(--brand);stroke-width:3}
svg.odo .tooth .sf:hover{filter:brightness(.95)}
svg.odo .tooth .sf.selsf{stroke:var(--brand);stroke-width:2.5}
svg.odo text.n{font-size:12px;font-weight:700;fill:var(--muted);text-anchor:middle;font-family:"Plus Jakarta Sans",sans-serif}
svg.odo .tooth.sel text.n{fill:var(--brand)}
svg.odo text.mk{font-size:22px;font-weight:800;text-anchor:middle;pointer-events:none}
svg.odo .midline{stroke:var(--line-2);stroke-dasharray:4 4}
svg.odo text.q{font-size:10px;font-weight:800;letter-spacing:.1em;fill:var(--muted);text-transform:uppercase}
.ov-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:600}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.imgs div{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#1e293b,#334155);display:grid;place-items:center;color:#cbd5e1;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--line)}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 16px}
.tl::before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--brand)}
.tl.planned::before{border-color:var(--brand-2);background:var(--brand-soft)}
.tl.finding::before{border-color:var(--amber-fill)}
.tl.cancel::before{border-color:var(--line-2)}
.tl b{font-size:13.5px}
.tl .m{font-size:12px;color:var(--muted)}
.pay{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line)}
.pay .track{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}
.pay .track i{display:block;height:100%;background:var(--green)}
.pay.due .track i{background:var(--amber-fill)}
.pay .nums{display:flex;gap:12px;font-size:12px;font-weight:700}
.tooth-card{padding:14px;border-radius:14px;background:linear-gradient(160deg,var(--brand-softer),var(--surface));border:1px solid var(--line);margin-bottom:16px}

.surfpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:4px}
.surfpad button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;font-weight:800;cursor:pointer;font-size:12px}
.surfpad button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.rail-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 12px}
.plist-back{display:none}

/* ---------- schedule ---------- */
.sched{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.mini-cal{padding:14px}
.mini-cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.mini-cal .grid .dow{color:var(--muted);font-weight:700;font-size:10.5px;padding:4px 0}
.mini-cal .grid button{aspect-ratio:1;border:0;background:none;border-radius:10px;cursor:pointer;font-weight:600;position:relative;color:var(--ink-2)}
.mini-cal .grid button:hover{background:var(--surface-3)}
.mini-cal .grid button.out{color:var(--line-2)}
.mini-cal .grid button.today{color:var(--brand);font-weight:800}
.mini-cal .grid button.on{background:var(--brand);color:var(--brand-ink)}
.mini-cal .grid button i{position:absolute;bottom:4px;left:50%;width:4px;height:4px;border-radius:50%;transform:translateX(-50%);background:var(--green)}
.mini-cal .grid button i.full{background:var(--line-2)}
.dayview{overflow:auto;max-height:calc(100dvh - var(--top-h) - 150px)}
.dv{display:grid;min-width:640px}
.dv .colh{position:sticky;top:0;z-index:3;background:var(--surface);padding:12px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);display:flex;gap:10px;align-items:center}
.dv .colh small{display:block;color:var(--muted);font-size:11.5px}
.dv .gutter{position:relative;border-right:0}
.dv .gutter span{position:absolute;right:8px;font-size:11px;color:var(--muted);font-weight:700;transform:translateY(-50%)}
.dv .col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--hh));}
.dv .col .off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--surface-3),var(--surface-3) 6px,transparent 6px,transparent 12px)}
.ev{position:absolute;left:6px;right:6px;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;overflow:hidden;cursor:pointer;border:1px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ev small{display:block;font-weight:500;opacity:.85}
.ev.slot{background:transparent;border:1.5px dashed var(--line-2);color:var(--muted);box-shadow:none;font-weight:600;display:flex;align-items:center;gap:6px}
.ev.slot:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-softer)}
.ev.sel{outline:3px solid var(--brand);outline-offset:1px}

/* ---------- billing / generic split ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
.inv-lines td{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.total-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.total-row.big{font-size:16px;font-weight:800;padding-top:8px}

/* ---------- team ---------- */
.matrix td.c,.matrix th.c{text-align:center}
.tick{width:22px;height:22px;border-radius:7px;display:inline-grid;place-items:center;background:var(--brand-softer);color:var(--brand)}
.tick.no{background:var(--surface-3);color:var(--line-2)}
.tick svg.i{width:14px;height:14px;stroke-width:2.6}

/* ---------- help ---------- */
.help{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;align-items:start}
.help .list{max-height:calc(100dvh - var(--top-h) - 220px);overflow:auto}
.gitem{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.gitem:hover{background:var(--surface-3)}
.gitem.on{background:var(--brand-softer);box-shadow:inset 3px 0 0 var(--brand)}
.gitem .tp{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--brand);text-transform:uppercase}
.gitem b{display:block;font-size:13.5px}
.gitem small{color:var(--muted);font-size:12px}
.steps{list-style:none;padding:0;margin:16px 0;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:14px;counter-increment:s;font-size:14px;line-height:1.6}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:9px;background:var(--brand-softer);color:var(--brand);font-weight:800;display:grid;place-items:center}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:13.5px}.set-row small{color:var(--muted)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,18,20,.45);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.scrim.show{display:flex}
.modal{width:min(640px,100%);max-height:84vh;overflow:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.cmdk{width:min(640px,100%);background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);border:1px solid var(--line);overflow:hidden}
.cmdk input{width:100%;height:56px;border:0;border-bottom:1px solid var(--line);padding:0 18px;font-size:16px;outline:none;background:var(--surface)}
.cmdk .res{max-height:50vh;overflow:auto;padding:6px}
.cmdk .res div{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdk .res div.on,.cmdk .res div:hover{background:var(--brand-softer)}
.cmdk .res h6{margin:8px 12px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:center;z-index:60;transition:.25s;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast svg.i{color:var(--brand-2)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- sign-in ---------- */
.signin{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface)}
.signin .hero{background:radial-gradient(1200px 600px at 10% 10%,#14B8A6 0,transparent 55%),radial-gradient(900px 600px at 90% 90%,#2563EB 0,transparent 55%),#0F766E;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.signin .hero h1{font-size:clamp(30px,3.2vw,52px);line-height:1.08;letter-spacing:-.03em;margin:0 0 16px;max-width:14ch}
.signin .hero p{opacity:.88;max-width:46ch;font-size:16px}
.signin .feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px}
.signin .feat div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px;font-weight:600;font-size:13px}
.signin .feat b{display:block;font-size:14px;margin-bottom:2px}
.signin .form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.signin .box{width:min(420px,100%)}
.gbtn{width:100%;height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;cursor:pointer;font-size:15px}
.gbtn:hover{background:var(--surface-3)}

/* ---------- patient portal ---------- */
.portal{max-width:1400px;margin:0 auto;padding:24px clamp(16px,2vw,32px)}
.portal-top{display:flex;align-items:center;gap:12px;padding:12px clamp(16px,2vw,32px);background:var(--surface);border-bottom:1px solid var(--line)}
.portal-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.slots button{height:38px;border-radius:10px;border:1.5px dashed var(--line-2);background:var(--surface);font-weight:700;cursor:pointer}
.slots button:hover,.slots button.on{border-style:solid;border-color:var(--brand);background:var(--brand-softer);color:var(--brand)}
.slots button:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}

/* ---------- bottom nav (phones) ---------- */
.bnav{display:none}

/* ---------- responsive ---------- */
@media (max-width:1599px){
  .pw{grid-template-columns:300px minmax(0,1fr)}
  .prail{grid-column:2;border-left:0;border-top:1px solid var(--line);overflow:visible!important;display:none}
  .pw.rail-below .prail{display:block}
  .pcenter .rail-inline{display:block}
}
@media (min-width:1600px){.pcenter .rail-inline{display:none}}
@media (max-width:1279px){
  :root{--nav-w:76px}
  .brand b,.brand small,.nav h6,.nav a span.lbl,.side-foot .plan{display:none}
  .brand{justify-content:center;padding:0}
  .nav a{justify-content:center;padding:11px}
  .nav a .badge{position:absolute;top:3px;right:6px;margin:0}
  .dash{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .help{grid-template-columns:320px minmax(0,1fr)}
  .me b,.me small{display:none}.me{padding:4px}
}
@media (max-width:1023px){
  .pw{grid-template-columns:1fr;height:auto}
  .pw .plist{display:none}
  .pw.listmode .plist{display:flex;height:calc(100dvh - var(--top-h) - 64px)}
  .pw.listmode .pcenter{display:none}
  .prail{grid-column:1}
  .plist-back{display:inline-flex}
  .sched{grid-template-columns:1fr}
  .sched .side-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .help{grid-template-columns:1fr}.help .list{max-height:340px}
  .signin{grid-template-columns:1fr}.signin .hero{padding:32px 24px}.signin .feat{display:none}
  .portal-grid{grid-template-columns:1fr}
}
@media (max-width:767px){
  .app{grid-template-columns:1fr;grid-template-rows:56px minmax(0,1fr) 64px}
  :root{--top-h:56px}
  .side{display:none}
  .app.drawer .side{display:flex;position:fixed;inset:0 auto 0 0;width:280px;z-index:40;box-shadow:var(--shadow-lg)}
  .app.drawer .brand b,.app.drawer .brand small,.app.drawer .nav h6,.app.drawer .nav a span.lbl{display:block}
  .app.drawer .nav a{justify-content:flex-start;padding:9px 12px}
  .app.drawer .brand{justify-content:flex-start;padding:0 18px}
  .menu-btn{display:grid}
  .top{padding:0 12px;gap:8px}
  .top .crumb small{display:none}
  .search{max-width:none}.search button span.t,.search kbd{display:none}.search button{width:40px;padding:0;justify-content:center}
  .search{flex:0 0 auto;margin-left:auto;margin-right:0}
  .me{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);grid-column:1}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none}
  .bnav a.on{color:var(--brand)}
  .page{padding:16px}
  .counters{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .val{font-size:22px}.kpi svg.spark{display:none}
  .kv{grid-template-columns:110px 1fr}
  .pw.listmode .plist{height:calc(100dvh - 56px - 64px)}
  .set-grid{grid-template-columns:1fr}
  .hide-sm{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function toothLabel(n){

  }
  const qn={1:"UR",2:"UL",3:"LL",4:"LR",5:"UR",6:"UL",7:"LL",8:"LR"}[q]; return qn+(q>4?"ABCDE"[u-1]:u);
}

/* ---------- ODONTOGRAM ---------- */
function toothCounts(p){ let t=0,pl=0,f=0,m=0; Object.values(p.chart).forEach(c=>{ if(c.missing) m++; if(c.treated) t++; if(c.planned) pl++; if(c.finding) f++; }); return {t,pl,f,m}; }
function surfClass(c,s){ if(!c) return ""; const has = a => a && (a.includes(s)||a.includes("W")); if(has(c.finding)) return "finding"; if(has(c.treated)) return "treated"; if(has(c.planned)) return "planned"; return ""; }
function toothG(n,x,y,c,ro){
  const q = Math.floor(n/10)%4||4, upper = [1,2,5,6].includes(Math.floor(n/10)), rightSide=[1,4,5,8].includes(Math.floor(n/10));
  const sz=44, i=13; // outer/inner offsets
  const L=x, T=y, R=x+sz, B=y+sz, il=x+i, it=y+i, ir=x+sz-i, ib=y+sz-i;
  const top = upper?"F":"L", bot = upper?"L":"F", left = rightSide?"D":"M", right = rightSide?"M":"D";
  const center = isPosterior(n)&&n%10<6||n%10>=4 ? "O":"I";
  const polys = [[top,`${L},${T} ${R},${T} ${ir},${it} ${il},${it}`],[right,`${R},${T} ${R},${B} ${ir},${ib} ${ir},${it}`],[bot,`${L},${B} ${R},${B} ${ir},${ib} ${il},${ib}`],[left,`${L},${T} ${il},${it} ${il},${ib} ${L},${B}`]];
  const sel = S.tooth===n || S.multi.includes(n);
  const cls = ["tooth",c&&c.a?"assessed":"",c&&c.missing?"missing":"",sel?"sel":""].join(" ");
  const onc = ro?`onclick="selTooth(${n},event)"`:`onclick="selTooth(${n},event)"`;
  let mk=""; if(c&&c.missing) mk=`<text class="mk" x="${x+sz/2}" y="${y+sz/2+8}" fill="var(--missing)">×</text>`; else if(c&&c.planned) mk=`<text class="mk" x="${x+sz/2}" y="${y+sz/2+8}" fill="var(--brand)" style="font-size:18px">+</text>`;
  const sfSel = s => sel && S.tooth===n && S.surf===s ? " selsf":"";
  return `<g class="${cls}" ${onc} data-n="${n}"><title>${toothLabel(n)} · ${toothName(n)}</title>
    <rect class="frame" x="${L-4}" y="${T-4}" width="${sz+8}" height="${sz+8}" rx="9"/>
    ${polys.map(([s,pts])=>`<polygon class="sf ${c&&!c.missing?surfClass(c,s):""}${sfSel(s)}" points="${pts}"/>`).join("")}
    <rect class="sf ${c&&!c.missing?surfClass(c,center==="I"?"I":"O")||surfClass(c,"O"):""}${sfSel(center)}" x="${il}" y="${it}" width="${ir-il}" height="${ib-it}" rx="2"/>
    ${mk}
    <text class="n" x="${x+sz/2}" y="${upper? T-10 : B+20}">${toothLabel(n)}</text></g>`;
}
function odontogram(p,ro=false){
  const prim = S.dentition==="Primary", mixed = S.dentition==="Mixed";
  const rowsP = [[FDI_PERM.UR,FDI_PERM.UL],[FDI_PERM.LR,[...FDI_PERM.LL]]];
  const rowsD = [[[55,54,53,52,51],[61,62,63,64,65]],[[85,84,83,82,81],[71,72,73,74,75]]];
  const step=54, gap=26, w=16*step+gap+20;
  let out="", y=46, h=0;
  const drawRow=(pair,yy,offset)=>{ let x=10+offset; pair[0].forEach(n=>{ out+=toothG(n,x,yy,p.chart[n],ro); x+=step;}); x+=gap; pair[1].forEach(n=>{ out+=toothG(n,x,yy,p.chart[n],ro); x+=step;}); };
  const sets = prim? [[rowsD,3*step]] : mixed? [[rowsP,0],[rowsD,3*step]] : [[rowsP,0]];
  const blocks=[];
  sets.forEach(([rows,off],si)=>{ blocks.push([rows[0],off,true]); });
  sets.slice().reverse().forEach(([rows,off])=>{ blocks.push([rows[1],off,false]); });
  blocks.forEach(([pair,off,up],bi)=>{ if(!up && bi===Math.ceil(blocks.length/2)) y+=22; drawRow(pair,y,off); y+= 44+ (up?34:34); });
  h=y+6;
  const mid = 10+8*step+gap/2-5;
  out = `<line class="midline" x1="${mid}" y1="6" x2="${mid}" y2="${h-6}"/>
         <line class="midline" x1="6" y1="${h/2+2}" x2="${w-6}" y2="${h/2+2}"/>
         <text class="q" x="10" y="11">Patient right</text><text class="q" x="${w-10}" y="11" text-anchor="end">Patient left</text>` + out;
  return `<div class="odo-wrap"><svg class="odo" viewBox="0 0 ${w} ${h}" role="img" aria-label="Dental chart">${out}</svg></div>`;
}
const LEGEND = `<div class="legend"><span><i style="background:var(--unassessed)"></i>Not assessed</span><span><i style="background:var(--assessed)"></i>Assessed</span><span><i style="background:var(--treated)"></i>Treated</span><span><i style="background:var(--brand-soft)"></i>Planned +</span><span><i style="background:var(--amber-fill)"></i>Finding</span><span><i style="background:var(--surface-3);border-style:dashed"></i>Missing ×</span></div>`;

function selTooth(n,e){
  if(e && (e.ctrlKey||e.metaKey||e.shiftKey)){ const set=new Set(S.multi.length?S.multi:(S.tooth?[S.tooth]:[])); set.has(n)?set.delete(n):set.add(n); S.multi=[...set]; S.tooth=null; }
  else { S.multi=[]; S.tooth = S.tooth===n? null : n; S.surf="W"; }
  // capture surface click
  if(e && e.target && e.target.classList.contains("sf") && S.tooth===n){ const pts=[...e.target.parentNode.querySelectorAll(".sf")]; const idx=pts.indexOf(e.target); const n10=Math.floor(n/10); const upper=[1,2,5,6].includes(n10), rs=[1,4,5,8].includes(n10); const map=[upper?"F":"L",rs?"M":"D",upper?"L":"F",rs?"D":"M",isPosterior(n)?"O":"I"]; S.surf=map[idx]||"W"; }
  renderMain();
}

function miniCal(){
  const m=S.calMonth, first=new Date(m.getFullYear(),m.getMonth(),1), start=addDays(first,-((first.getDay()+6)%7));
  const cells=[...Array(42)].map((_,i)=>{const d=addDays(start,i); const ap=apptsFor(d); const total=d.getDay()===5?0:DOCTORS.reduce((a,doc)=>a+(HOURS[doc.id]||[]).reduce((b,[s,e])=>b+(e-s)/30,0),0); const used=ap.filter(a=>a.status!=="Cancelled").reduce((a,x)=>a+x.dur/30,0); const dot=d.getDay()===5?"":(used>=total?'<i class="full"></i>':'<i></i>');
    return `<button class="${d.getMonth()!==m.getMonth()?"out":""} ${iso(d)===iso(TODAY)?"today":""} ${iso(d)===iso(S.day)?"on":""}" onclick="S.day=new Date(${d.getFullYear()},${d.getMonth()},${d.getDate()});S.selAppt=null;renderMain()">${d.getDate()}${dot}</button>`;}).join("");
  return `<div class="card mini-cal"><div class="between" style="margin-bottom:8px"><b>${m.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</b><div class="row" style="gap:4px"><button class="icon-btn" style="width:30px;height:30px" onclick="S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()-1,1);renderMain()">${I("chevl")}</button><button class="icon-btn" style="width:30px;height:30px" onclick="S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()+1,1);renderMain()">${I("chev")}</button></div></div>
  <div class="grid">${["Mo","Tu","We","Th","Fr","Sa","Su"].map(d=>`<span class="dow">${d}</span>`).join("")}${cells}</div>
  <div class="legend" style="margin-top:8px"><span><i style="background:var(--green);border-radius:50%;width:8px;height:8px"></i>Free slots</span><span><i style="background:var(--line-2);border-radius:50%;width:8px;height:8px"></i>Fully booked</span></div></div>`;
}

      ${iso(S.day)===iso(TODAY)?`<div class="now-line" style="left:0;right:0;width:auto;height:2px;top:${px(NOW_MIN)}px;bottom:auto"></div>`:""}</div>`;}).join("");

    ${sel.status==="Requested"?`<div class="notice" style="margin-top:12px">${I("alert")}<span>Booked in the patient app, but the time was taken meanwhile. Reschedule then confirm, or cancel and call the patient.</span></div>`:""}
    <div class="chips" style="margin-top:14px">${["Confirmed","Checked-in","In progress","Completed","Cancelled","No show"].map(s=>`<button class="chip ${sel.status===s?"on":""}" onclick="setStatus('${sel.id}','${s}')">${s}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn primary sm" onclick="go('patients/${p.id}')">Open patient</button><button class="btn sm" onclick="bookAppt('${sel.doc}',${sel.start},'${p.id}')">Reschedule / edit</button></div></div></div>`;})()
    : `<div class="card"><div class="card-h"><h3>${fmtDay(S.day)}</h3></div><div class="card-b">

/* ---------- BILLING ---------- */
function pageBilling(){
  const all=PATIENTS.flatMap(p=>p.invoices.map(v=>({p,v}))).sort((a,b)=>b.v.date.localeCompare(a.v.date));
  const st=v=>v.status==="Void"?"Void":invPaid(v)>=invTotal(v)?"Paid":invPaid(v)?"Partially paid":"Unpaid";
  const list=all.filter(x=>S.invFilter==="All"||st(x.v)===S.invFilter);
  const sel=all.find(x=>x.v.no===S.selInv)||list[0];
  const billed=all.reduce((a,x)=>a+invTotal(x.v),0), rec=all.reduce((a,x)=>a+invPaid(x.v),0);
  return `<div class="page"><div class="page-head"><div><h1 class="h1">Billing</h1><p class="muted small" style="margin:2px 0 0">Billed amounts and money received are shown separately</p></div><div class="r"><button class="btn">${I("download")}Export CSV</button><button class="btn primary" onclick="newInvoice()">${I("plus")}Create invoice</button></div></div>
  <div class="kpis"><div class="card kpi"><div class="lbl">Billed (all)</div><div class="val num">${money(billed)}</div></div><div class="card kpi"><div class="lbl">Received</div><div class="val num" style="color:var(--green)">${money(rec)}</div></div><div class="card kpi"><div class="lbl">Outstanding</div><div class="val num" style="color:var(--amber)">${money(billed-rec)}</div></div><div class="card kpi"><div class="lbl">Invoices</div><div class="val num">${all.length}</div></div></div>
  <div class="split"><div class="card"><div class="card-h"><div class="chips">${["All","Unpaid","Partially paid","Paid","Void"].map(f=>`<button class="chip ${S.invFilter===f?"on":""}" onclick="S.invFilter='${f}';renderMain()">${f}</button>`).join("")}</div></div>
   <div class="table-wrap" style="margin-top:10px"><table class="t"><thead><tr><th>Invoice</th><th>Date</th><th>Patient</th><th class="hide-sm">Items</th><th style="text-align:right">Total</th><th style="text-align:right">Received</th><th>Status</th></tr></thead><tbody>
   ${list.map(({p,v})=>`<tr class="click ${sel&&sel.v===v?"sel":""}" onclick="S.selInv='${v.no}';renderMain()"><td class="mono">#${v.no}</td><td>${fmtDate(v.date)}</td><td><b>${esc(p.name)}</b></td><td class="hide-sm muted">${esc(v.lines.map(l=>l[0]).join(", "))}</td><td class="num" style="text-align:right">${money(invTotal(v))}</td><td class="num" style="text-align:right">${money(invPaid(v))}</td><td><span class="badge ${({Paid:"green","Partially paid":"amber",Unpaid:"red",Void:""})[st(v)]}">${st(v)}</span></td></tr>`).join("")}
   </tbody></table></div></div>
   <div style="position:sticky;top:0">${sel?`<div class="small muted" style="margin:0 0 8px;font-weight:700">${esc(sel.p.name)} · <a href="#/patients/${sel.p.id}">open patient</a></div>`+invoiceCard(sel.p,sel.v):""}</div></div></div>`;
}

/* ---------- REPORTS ---------- */
function pageReports(){
  seed=99; const days=S.period==="Day"?1:S.period==="Week"?7:S.period==="Month"?30:90;
  const series=[...Array(Math.min(days,30))].map((_,i)=>18000+Math.round(rnd()*40000));
  const rec=series.reduce((a,b)=>a+b,0)*(days>30?3:1), billed=Math.round(rec*1.18), ref=Math.round(rec*.012);
  const mx=Math.max(...series);
  const byMethod=[["Cash",.41],["bKash",.27],["Nagad",.12],["Card",.14],["Bank",.06]];
  const proc=[["Root canal",42,210000],["Composite filling",118,236000],["Scaling & polishing",96,240000],["Extraction",37,55500],["Crown (PFM)",14,112000],["Orthodontic braces",6,480000]];
  const pm=Math.max(...proc.map(x=>x[2]));
  const balances=PATIENTS.map(p=>[p,patientDue(p)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<div class="page"><div class="page-head"><div><h1 class="h1">Reports</h1><p class="muted small" style="margin:2px 0 0">Asia/Dhaka · figures reconcile to source payments</p></div><div class="r"><div class="seg">${["Day","Week","Month","Custom","All"].map(x=>`<button class="${S.period===x?"on":""}" onclick="S.period='${x}';renderMain()">${x}</button>`).join("")}</div><button class="btn">${I("share")}Share financial report CSV</button></div></div>
  <div class="kpis">${[["Billed in period",billed,""],["Payments received",rec,"var(--green)"],["Refunds paid out",ref,"var(--red)"],["Net cash",rec-ref,"var(--brand)"],["Outstanding",PATIENTS.reduce((a,p)=>a+patientDue(p),0),"var(--amber)"]].map(([l,v,c])=>`<div class="card kpi"><div class="lbl">${l}</div><div class="val num" style="color:${c||"var(--ink)"}">${money(v)}</div></div>`).join("")}</div>
  <div class="dash">
   <div class="card wide"><div class="card-h"><h3>Payments received per day</h3><span class="sub">cash basis</span></div><div class="card-b"><div class="bars" style="height:220px">${series.map((v,i)=>`<div class="b" title="${money(v)}"><i style="height:${v/mx*100}%"></i><span class="hide-sm">${i%3===0?i+1:""}</span></div>`).join("")}</div></div></div>
   <div class="card"><div class="card-h"><h3>By payment method</h3></div><div class="card-b">${byMethod.map(([m,f],i)=>`<div style="margin-bottom:12px"><div class="between small"><b>${m}</b><span class="num">${money(rec*f)} · ${Math.round(f*100)}%</span></div><div class="pay" style="padding:0;border:0;background:none"><div class="track"><i style="width:${f*100/0.41}%;background:${["#0F766E","#E2136E","#F7941D","#2563EB","#64748B"][i]}"></i></div></div></div>`).join("")}</div></div>
   <div class="card wide"><div class="card-h"><h3>Totals by procedure</h3></div><div class="table-wrap"><table class="t"><thead><tr><th>Procedure</th><th>Count</th><th>Revenue</th><th style="width:40%"></th></tr></thead><tbody>${proc.map(([n,c,r])=>`<tr><td><b>${n}</b></td><td class="num">${c}</td><td class="num">${money(r)}</td><td><div class="pay" style="padding:0;border:0;background:none;margin:0"><div class="track"><i style="width:${r/pm*100}%;background:var(--brand)"></i></div></div></td></tr>`).join("")}</tbody></table></div></div>
   <div class="card"><div class="card-h"><h3>Largest balances due</h3></div><div class="card-b">${balances.map(([p,d])=>`<div class="list-item" style="cursor:pointer" onclick="go('patients/${p.id}')"><div class="avatar">${initials(p.name)}</div><div class="grow"><b>${esc(p.name)}</b><small>${p.phone}</small></div><b class="num" style="color:var(--amber)">${money(d)}</b></div>`).join("")}</div></div>
   <div class="card"><div class="card-h"><h3>Clinician workload</h3></div><div class="card-b">${DOCTORS.map((d,i)=>`<div class="list-item"><div class="avatar" style="background:${d.color}">${initials(d.name)}</div><div class="grow"><b>${esc(d.name)}</b><small>${[86,74,41][i]} visits · ${[91,84,77][i]}% utilization</small></div><span class="badge teal">${[112,96,38][i]} procedures</span></div>`).join("")}</div></div>
   <div class="card"><div class="card-h"><h3>Appointment states</h3></div><div class="card-b"><div class="counters" style="grid-template-columns:repeat(2,1fr)">${[["Completed",201,"var(--green)"],["Cancelled",18,"var(--red)"],["No show",9,"var(--red)"],["Upcoming",64,"var(--accent)"]].map(([l,v,c])=>`<div class="counter"><b class="num" style="color:${c}">${v}</b><span>${l}</span></div>`).join("")}</div></div></div>
  </div></div>`;
}

    <div class="set-row"><div><b>Active</b><small>Turn off to remove access; earlier work stays</small></div><label class="switch"><input type="checkbox" ${s.active?"checked":""}><i></i></label></div>

function setRole(id,r){ const s=STAFF.find(x=>x.id===id); s.role=r; s.access=[...ROLE_ACCESS[r]]; renderMain(); }
function toggleAccess(id,a){ const s=STAFF.find(x=>x.id===id); s.access=s.access.includes(a)?s.access.filter(x=>x!==a):[...s.access,a]; renderMain(); }

function pageHelp(){

/* ---------- dialogs ---------- */
function modal(title,body,saveLabel,onSave,wide){
  const sc=$("#scrim"); sc.innerHTML=`<div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" style="margin-left:auto;width:34px;height:34px" onclick="closeModal()" aria-label="Close">${I("x")}</button></div><div class="modal-b">${body}</div><div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="msave">${saveLabel}</button></div></div>`;
  sc.classList.add("show"); $("#msave").onclick=()=>{ if(onSave()!==false) closeModal(); };
  sc.onclick=e=>{ if(e.target===sc) closeModal(); };
  setTimeout(()=>{const f=sc.querySelector("input,select");f&&f.focus();},30);
}
function closeModal(){ $("#scrim").classList.remove("show"); $("#scrim").innerHTML=""; }
const opts=(arr,sel)=>arr.map(x=>`<option ${x===sel?"selected":""}>${esc(x)}</option>`).join("");
function registerPatient(id){
  const p=id?pat(id):null;
  modal(p?"Edit profile":"Register patient",`<div class="notice teal" style="margin-bottom:14px">${I("search")}<span>Search first to avoid duplicates. Similar records are listed here as you type.</span></div><div class="grid-form">
   <div class="field"><label>Full name</label><input class="input" id="rn" value="${p?esc(p.name):""}"></div><div class="field"><label>Phone</label><input class="input" id="rp" value="${p?p.phone:""}" placeholder="01XXX-XXXXXX"></div>
   <div class="field"><label>Date of birth</label><input class="input" type="date" value="${p?p.dob:""}"></div><div class="field"><label>Sex</label><select class="input">${opts(["Female","Male","Other"],p?(p.sex==="F"?"Female":"Male"):"")}</select></div>
   <div class="field" style="grid-column:1/-1"><label>Address</label><input class="input" value="${p?esc(p.address):""}"></div>
   <div class="field" style="grid-column:1/-1"><label>Medical alerts</label><div class="chips">${ALERTS.map(a=>`<button type="button" class="chip ${p&&p.alerts.includes(a)?"on":""}" onclick="this.classList.toggle('on')">${a}</button>`).join("")}</div></div>
   <div class="field" style="grid-column:1/-1"><label class="row" style="font-weight:600"><input type="checkbox" checked> Patient consents to appointment notifications</label></div></div>`,
   p?"Save":"Register patient",()=>{ if(p){toast("Profile updated");return;} const n=$("#rn").value.trim(); if(!n){$("#rn").focus();return false;} const np=makePatient(PATIENTS.length,n); np.name=n; np.phone=$("#rp").value||np.phone; np.treatments=[];np.invoices=[]; ALL_PERM.forEach(k=>delete np.chart[k]); PATIENTS.unshift(np); S.pending++; toast("Patient registered · "+np.id); go("patients/"+np.id); },true);
}
function recordTreatment(teeth,tid){
  const p=pat(S.pid); const t=tid?p.treatments.find(x=>x.id===tid):null;
  modal(t?"Edit treatment":"Record treatment · "+teeth.map(toothLabel).join(", "),`<div class="grid-form">
   <div class="field"><label>Procedure</label><input class="input" id="tp" list="procs" value="${t?esc(t.proc):""}" placeholder="Pick or type your own"><datalist id="procs">${PROCS.map(x=>`<option>${x}</option>`).join("")}</datalist></div>
   <div class="field"><label>Status</label><select class="input" id="ts">${opts(t?["Completed","In progress","Planned","Cancelled"]:["Completed","In progress","Planned"],t?t.status:"Completed")}</select></div>
   <div class="field"><label>Surfaces</label><div class="chips" id="tsf">${["W","M","D","F","L","O"].map(s=>`<button type="button" class="chip ${(t?t.surfaces:[S.surf]).includes(s)?"on":""}" onclick="this.classList.toggle('on')">${s}</button>`).join("")}</div></div>
   <div class="field"><label>Doctor</label><select class="input" id="td">${opts(DOCTORS.map(d=>d.name),t?t.doctor:DOCTORS[1].name)}</select></div>
   <div class="field"><label>Date</label><input class="input" type="date" id="tdt" value="${t?t.date:iso(TODAY)}"></div>
   <div class="field"><label>Total fee (${CUR})</label><input class="input" id="tf" type="number" value="${t?t.fee:""}" placeholder="Filled from Services"></div>
   <div class="field" style="grid-column:1/-1"><label>Notes</label><textarea class="input" id="tn">${t?esc(t.notes):""}</textarea></div></div>
   ${t?`<p class="small muted">The change log keeps the previous values.</p>`:""}`, "Save",()=>{
     const proc=$("#tp").value.trim()||"Composite filling", st=$("#ts").value, sf=[...document.querySelectorAll("#tsf .chip.on")].map(b=>b.textContent); const fee=+$("#tf").value||(SERVICES.find(s=>s[0]===proc)||[0,0])[1];
     if(t){ Object.assign(t,{proc,status:st,surfaces:sf.length?sf:["W"],doctor:$("#td").value,date:$("#tdt").value,fee,notes:$("#tn").value}); }
     else teeth.forEach(n=>{ p.treatments.push({id:"T"+Date.now()+n,tooth:n,proc,status:st,doctor:$("#td").value,date:$("#tdt").value,surfaces:sf.length?sf:["W"],fee,payments:[],notes:$("#tn").value}); const c=p.chart[n]=p.chart[n]||{}; c.a=1; const key=st==="Planned"?"planned":"treated"; c[key]=[...new Set([...(c[key]||[]),...(sf.length?sf:["W"])])]; });
     p.history.unshift([iso(TODAY)+" "+hm(NOW_MIN),"Dr. Arif Rahman",(t?"Edited ":"Recorded ")+proc+" "+teeth.map(toothLabel).join(", ")]);
     S.pending++; S.multi=[]; if(teeth.length===1) S.tooth=teeth[0]; toast(t?"Treatment updated":"Treatment recorded · "+teeth.length+" tooth"+(teeth.length>1?"s":"")); render(); },true);
  const tp=$("#tp"); tp && tp.addEventListener("change",()=>{ const s=SERVICES.find(x=>x[0]===tp.value); if(s&&!$("#tf").value) $("#tf").value=s[1]; });
}
function payDialog(pid,tid){
  const p=pat(pid), t=p.treatments.find(x=>x.id===tid); const last=t.payments[t.payments.length-1];
  modal(`${t.fee?"Add payment":"Set fee / add payment"} · ${esc(t.proc)} ${toothLabel(t.tooth)}`,`<div class="grid-form">
    <div class="field"><label>Total fee (${CUR})</label><input class="input" id="pf" type="number" value="${t.fee||(SERVICES.find(s=>s[0]===t.proc)||[0,""])[1]}"></div>
    <div class="field"><label>Paid at this visit (${CUR})</label><input class="input" id="pa" type="number" value="${last?last.amt:""}"></div>
    <div class="field"><label>Method</label><div class="seg" id="pm">${METHODS.map(m=>`<button type="button" class="${(last?last.method:"Cash")===m?"on":""}" onclick="[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${m}</button>`).join("")}</div></div>
    <div class="field"><label>Date</label><input class="input" type="date" id="pd" value="${iso(TODAY)}"></div>
    <div class="field" style="grid-column:1/-1"><label>Note</label><input class="input" id="pn" placeholder="e.g. visit ${t.payments.length+1} of 5"></div></div>
    <p class="small muted">Paid so far ${money(tPaid(t))}. The fee can't go below what was already paid. Also appears as an invoice in Billing.</p>`,"Save",()=>{
      const fee=+$("#pf").value, amt=+$("#pa").value; if(fee<tPaid(t)){toast("Fee can't be below what was paid");return false;}
      t.fee=fee; if(amt>0) t.payments.push({amt,method:document.querySelector("#pm .on").textContent,date:$("#pd").value,note:$("#pn").value});
      S.pending++; toast("Payment saved · "+money(amt)); render(); });
}

   <div class="notice teal" style="margin-top:14px">${I("check")}<span>8 slots: 17:00, 17:30, 18:00, 18:30, 19:00, 19:30, 20:00, 20:30</span></div>`,"Open 8 slots",()=>toast("8 slots opened · visible in the patient app"));
}
function newInvoice(pid){
  modal("New invoice · BDT",`<div class="grid-form"><div class="field" style="grid-column:1/-1"><label>Patient</label><input class="input" list="plist3" value="${pid?esc(pat(pid).name):""}"><datalist id="plist3">${PATIENTS.map(p=>`<option>${esc(p.name)}</option>`).join("")}</datalist></div>
   <div class="field"><label>Line description</label><input class="input" list="svc2" placeholder="Pick a service"><datalist id="svc2">${SERVICES.map(s=>`<option>${s[0]}</option>`).join("")}</datalist></div><div class="field"><label>Unit price (${CUR})</label><input class="input" type="number" value="500"></div><div class="field"><label>Quantity</label><input class="input" type="number" value="1"></div>
   <div class="field"><label>&nbsp;</label><button class="btn" type="button">${I("plus")}Add line</button></div>
   <div class="field"><label>Discount amount (${CUR})</label><input class="input" type="number" value="0"></div><div class="field"><label>Tax percent</label><input class="input" type="number" value="0"></div></div>`,"Issue invoice",()=>toast("Invoice issued"),true);
}
function addStaff(){
  modal("Add staff member",`<div class="grid-form"><div class="field"><label>Name</label><input class="input"></div><div class="field"><label>Google email</label><input class="input" placeholder="name@gmail.com"></div><div class="field"><label>Phone</label><input class="input"></div><div class="field"><label>Registration (optional)</label><input class="input"></div>
   <div class="field" style="grid-column:1/-1"><label>Role</label><div class="chips">${Object.keys(ROLE_ACCESS).map((r,i)=>`<button type="button" class="chip ${i===1?"on":""}" onclick="[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${r}</button>`).join("")}</div></div></div>
   <p class="small muted">When they sign in with this Google email they join your clinic with exactly this access.</p>`,"Add to team",()=>toast("Added to team · shared at once"));
}

/* ---------- command palette ---------- */
let cmdIdx=0;
function openCmd(){
  const sc=$("#scrim"); sc.innerHTML=`<div class="cmdk"><input id="cq" placeholder="Search patients, phone, ID, or type a page name…" autocomplete="off"><div class="res" id="cres"></div></div>`; sc.classList.add("show");
  sc.onclick=e=>{ if(e.target===sc) closeModal(); };
  const q=$("#cq"); q.oninput=()=>{cmdIdx=0;cmdRender();}; q.onkeydown=e=>{ const items=[...document.querySelectorAll("#cres [data-go]")]; if(e.key==="ArrowDown"){cmdIdx=Math.min(items.length-1,cmdIdx+1);cmdRender();e.preventDefault();} if(e.key==="ArrowUp"){cmdIdx=Math.max(0,cmdIdx-1);cmdRender();e.preventDefault();} if(e.key==="Enter"&&items[cmdIdx]){closeModal();go(items[cmdIdx].dataset.go);} };
  cmdRender(); setTimeout(()=>q.focus(),20);
}
function cmdRender(){
  const v=($("#cq")||{value:""}).value.trim().toLowerCase();
  const ps=PATIENTS.filter(p=>!v||[p.name,p.phone,p.id,p.portal||""].join(" ").toLowerCase().includes(v)).slice(0,7);
  const pages=[["home","Home"],["schedule","Appointments"],["billing","Billing"],["reports","Reports"],["team","Team & roles"],["settings","Clinic settings"],["help","How to use"]].filter(x=>!v||x[1].toLowerCase().includes(v));
  let i=0; const row=(go,html)=>`<div data-go="${go}" class="${i++===cmdIdx?"on":""}" onclick="closeModal();go('${go}')">${html}</div>`;
  $("#cres").innerHTML = (ps.length?`<h6>Patients</h6>`+ps.map(p=>row("patients/"+p.id,`<div class="avatar">${initials(p.name)}</div><div style="flex:1"><b>${esc(p.name)}</b><div class="small muted num">${p.id} · ${p.phone}${p.portal?" · "+p.portal:""}</div></div>${p.alerts.length?`<span class="badge red">${esc(p.alerts[0])}</span>`:""}`)).join(""):"")
    + (pages.length?`<h6>Go to</h6>`+pages.map(x=>row(x[0],`${I("chev")}<b>${x[1]}</b>`)).join(""):"") || `<div class="empty">Nothing found</div>`;
}

/* ---------- misc ---------- */
let toastT; function toast(msg){ const t=$("#toast"); t.innerHTML=I("check")+esc(msg); t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
function doSync(){ const b=$("#syncBtn"); if(b) b.innerHTML=I("sync","spin"); setTimeout(()=>{ const n=S.pending; S.pending=0; render(); toast(n?`Synced ${n} changes · 1 patient app booking received`:"Everything is up to date"); },900); }
function go(r){ location.hash="#/"+r; }
function parse(){
  const h=location.hash.replace(/^#\//,"")||"home"; const [r,id]=h.split("/");
  S.route = ["home","patients","schedule","billing","reports","team","settings","help","signin","portal"].includes(r)?r:"home";
  if(r==="patients"&&id&&pat(id)){ if(S.pid!==id){S.pid=id;S.tooth=null;S.multi=[];} }
}
function renderMain(){ const m=$("#main"); if(!m){render();return;} const st=m.scrollTop; const rail=document.querySelector(".prail"), rs=rail?rail.scrollTop:0, pl=document.querySelector(".plist .items"), ps=pl?pl.scrollTop:0; m.innerHTML=pageFor(); m.scrollTop=st; const r2=document.querySelector(".prail"); if(r2) r2.scrollTop=rs; const p2=document.querySelector(".plist .items"); if(p2) p2.scrollTop=ps; }
function renderMainKeep(el){ const id=el.id, pos=el.selectionStart; renderMain(); const n=document.getElementById(id); if(n){n.focus(); n.setSelectionRange(pos,pos);} }
function pageFor(){ return ({home:pageHome,patients:pagePatients,schedule:pageSchedule,billing:pageBilling,reports:pageReports,team:pageTeam,settings:pageSettings,help:pageHelp})[S.route](); }
function render(){
  parse();
  if(S.route==="signin"){ $("#root").innerHTML=pageSignin(); return; }
  if(S.route==="portal"){ $("#root").innerHTML=pagePortal(); return; }
  $("#root").innerHTML=shell(pageFor());
}
addEventListener("hashchange",()=>{ render(); const m=$("#main"); if(m) m.scrollTop=0; });
addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openCmd(); }
  if(e.key==="Escape"){ closeModal(); const a=$("#app"); a&&a.classList.remove("drawer"); }
});
render();
</script>
</body>
</html>
